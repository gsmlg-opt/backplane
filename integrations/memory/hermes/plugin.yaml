name: backplane-memory
version: 1.10.37
description: "Persistent cross-session memory for Hermes Agent via the Backplane host agent."
author: "Backplane"
homepage: "https://github.com/gsmlg-opt/backplane"
license: Apache-2.0

category: memory
tags:
  - memory
  - backplane
  - mcp

hooks:
  - prefetch
  - queue_prefetch
  - sync_turn
  - on_session_end
  - on_session_switch
  - on_pre_compress
  - on_memory_write
  - system_prompt_block
  - shutdown
