name: backplane-memory
version: 1.10.54
description: "Persistent cross-session memory for OpenClaw via the Backplane host agent."
author: "Backplane"
homepage: "https://github.com/gsmlg-opt/backplane"
license: Apache-2.0

category: memory
tags:
  - memory
  - backplane
  - mcp
  - context

hooks:
  - before_prompt_build
  - agent_end
  - session_end

config:
  enabled: true
  base_url: http://127.0.0.1:4222
  agent_id: openclaw
  token_budget: 2000
  profile_id: default
  bindings: []
  native_sync: true
  fallback_on_error: true
  timeout_ms: 5000
