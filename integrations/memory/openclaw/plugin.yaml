name: backplane-memory
version: 1.10.74
description: "Backplane memory shared across the user's agents and hosts, via the local Backplane host agent."
author: "Backplane"
homepage: "https://github.com/gsmlg-opt/backplane"
license: Apache-2.0

category: memory
tags:
  - memory
  - backplane
  - mcp
  - context

hooks:
  - before_prompt_build
  - agent_end
  - session_end

config:
  enabled: true
  base_url: http://127.0.0.1:4222
  agent_id: openclaw
  token_budget: 2000
  search_limit: 8
  profile_id: default
  timeout_ms: 5000
