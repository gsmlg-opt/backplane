name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28.5.0.5"
  RUST_VERSION: "1.95.0"
  MIX_ENV: test
  PGHOST: /var/run/postgresql

jobs:
  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        app:
          - backplane
          - backplane_admin
          - backplane_agent_runtime
          - backplane_ai_protocol
          - backplane_ai_protocol_testkit
          - backplane_api
          - backplane_auth
          - backplane_data_case
          - backplane_host_agent
          - backplane_llama
          - backplane_mcp
          - backplane_mcp_protocol
          - backplane_memory
          - backplane_memory_contract
          - backplane_monitor
          - backplane_skill_protocol
          - backplane_skills
          - backplane_system
          - backplane_telemetry
          - day_ex
          - math_ex
          - relayixir

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      - name: Set up agent runtime command prerequisites
        if: matrix.app == 'backplane_agent_runtime'
        run: |
          sudo apt-get install -y --no-install-recommends ca-certificates curl perl procps util-linux xz-utils
          coreutils_version="9.4"
          coreutils_sha256="ea613a4cf44612326e917201bbbcdfbd301de21ffc3b59b6e5c07e040b275e52"
          coreutils_archive="$RUNNER_TEMP/coreutils-${coreutils_version}.tar.xz"
          coreutils_source="$RUNNER_TEMP/coreutils-${coreutils_version}"
          curl --fail --location --silent --show-error \
            --output "$coreutils_archive" \
            "https://ftp.gnu.org/gnu/coreutils/coreutils-${coreutils_version}.tar.xz"
          echo "${coreutils_sha256}  ${coreutils_archive}" | sha256sum --check -
          tar -xJf "$coreutils_archive" -C "$RUNNER_TEMP"
          (
            cd "$coreutils_source"
            ./configure --disable-nls --without-selinux --enable-single-binary=symlinks
            make -j"$(nproc)"
          )
          coreutils_path="$coreutils_source/src/coreutils"
          test -x "$coreutils_path"
          test "$(uname -s)" = "Linux"
          test -r /proc/self/stat
          for command_name in setsid sh kill; do
            command_path="$(type -P "$command_name")"
            test -x "$command_path"
          done
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          ln -s "$coreutils_path" "$smoke_dir/env"
          ln -s "$coreutils_path" "$smoke_dir/printf"
          ln -s "$coreutils_path" "$smoke_dir/sleep"
          test "$("$smoke_dir/env" "$smoke_dir/printf" '%s' runtime)" = "runtime"
          "$smoke_dir/sleep" 0
          echo "COREUTILS=$coreutils_path" >> "$GITHUB_ENV"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-rust-${{ env.RUST_VERSION }}-mix-${{ env.MIX_ENV }}-job-${{ github.job }}-app-${{ matrix.app }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-rust-${{ env.RUST_VERSION }}-mix-${{ env.MIX_ENV }}-job-${{ github.job }}-app-${{ matrix.app }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Install standalone package dependencies
        if: matrix.app == 'backplane_skill_protocol'
        run: mix do --app backplane_skill_protocol cmd mix deps.get

      - name: Start PostgreSQL 17 with pgvector
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17 build-essential
          git clone --branch v0.8.0 --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector with_llvm=no
          sudo make -C /tmp/pgvector with_llvm=no install
          sudo pg_ctlcluster 16 main stop || true
          sudo pg_dropcluster --stop 17 main || true
          sudo pg_createcluster 17 main --start --port 5432
          sudo -u postgres createuser --superuser "$USER" || true
          pg_isready -h "$PGHOST"

      - name: Prepare test database
        run: mix ecto.setup

      - name: Run tests
        run: |
          if [ "${{ matrix.app }}" = "backplane_memory" ]; then
            mix do --app backplane_memory cmd mix test --exclude memory_qualification_runtime
          elif [ "${{ matrix.app }}" = "backplane_ai_protocol_testkit" ]; then
            mix do --app backplane_ai_protocol_testkit test
          else
            mix do --app ${{ matrix.app }} cmd mix test
          fi
