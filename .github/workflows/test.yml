name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28.5.0.5"
  RUST_VERSION: "1.95.0"
  MIX_ENV: test
  PGHOST: /var/run/postgresql

jobs:
  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        app:
          - backplane
          - backplane_admin
          - backplane_api
          - backplane_auth
          - backplane_data_case
          - backplane_host_agent
          - backplane_llama
          - backplane_mcp
          - backplane_mcp_protocol
          - backplane_memory
          - backplane_monitor
          - backplane_skills
          - backplane_system
          - backplane_telemetry
          - day_ex
          - math_ex
          - relayixir

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-rust-${{ env.RUST_VERSION }}-mix-${{ env.MIX_ENV }}-job-${{ github.job }}-app-${{ matrix.app }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-rust-${{ env.RUST_VERSION }}-mix-${{ env.MIX_ENV }}-job-${{ github.job }}-app-${{ matrix.app }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Start PostgreSQL 17 with pgvector
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17 build-essential
          git clone --branch v0.8.0 --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector with_llvm=no
          sudo make -C /tmp/pgvector with_llvm=no install
          sudo pg_ctlcluster 16 main stop || true
          sudo pg_dropcluster --stop 17 main || true
          sudo pg_createcluster 17 main --start --port 5432
          sudo -u postgres createuser --superuser "$USER" || true
          pg_isready -h "$PGHOST"

      - name: Prepare test database
        run: mix ecto.setup

      - name: Run tests
        run: mix do --app ${{ matrix.app }} cmd mix test
