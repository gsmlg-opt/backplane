name: Memory Plugins

on:
  push:
    paths:
      - "apps/backplane_memory/**"
      - "apps/backplane_memory_contract/**"
      - "apps/backplane_system/**"
      - "apps/backplane_api/**"
      - "apps/backplane_host_agent/**"
      - "apps/backplane_auth/**"
      - "apps/backplane_skills/**"
      - "apps/backplane_data_case/**"
      - "apps/*/mix.exs"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - "integrations/memory/**"
      - "test/support/**"
      - "test/openclaw_capture_barrier_test.exs"
      - "test/openclaw_owned_process_test.exs"
      - ".github/workflows/memory-plugins.yml"
  pull_request:
    paths:
      - "apps/backplane_memory/**"
      - "apps/backplane_memory_contract/**"
      - "apps/backplane_system/**"
      - "apps/backplane_api/**"
      - "apps/backplane_host_agent/**"
      - "apps/backplane_auth/**"
      - "apps/backplane_skills/**"
      - "apps/backplane_data_case/**"
      - "apps/*/mix.exs"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - "integrations/memory/**"
      - "test/support/**"
      - "test/openclaw_capture_barrier_test.exs"
      - "test/openclaw_owned_process_test.exs"
      - ".github/workflows/memory-plugins.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"
  MIX_ENV: test
  PGHOST: /var/run/postgresql

jobs:
  memory-plugins:
    name: Memory Plugins
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: deps
          key: memory-plugins-ubuntu26-v1-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs', 'package.json', 'package-lock.json') }}
          restore-keys: |
            memory-plugins-ubuntu26-v1-

      - name: Install dependencies
        run: mix deps.get

      - name: Start PostgreSQL 17 with pgvector
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-max-time 240 \
            --connect-timeout 15 --max-time 60 \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17 build-essential
          git clone --branch v0.8.0 --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config with_llvm=no
          sudo make -C /tmp/pgvector PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config with_llvm=no install
          sudo pg_ctlcluster 16 main stop || true
          sudo pg_dropcluster --stop 17 main || true
          sudo pg_createcluster 17 main --start --port 5432
          sudo -u postgres createuser --superuser "$USER" || true
          pg_isready -h "$PGHOST"

      - name: Set up Python for Hermes contract tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up qualified OpenClaw Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"

      - name: Verify Hermes provider contract
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover
          -s integrations/memory/tests -p 'test_hermes*.py' -v

      - name: Verify OpenClaw acceptance helpers
        run: |
          mix run --no-start test/openclaw_capture_barrier_test.exs
          mix run --no-start test/openclaw_owned_process_test.exs

      - name: Verify OpenClaw provider contract
        run: node --test integrations/memory/tests/test_openclaw*.mjs

      - name: Verify outage, privacy, performance, and integration adapters
        run: |
          mix test \
            apps/backplane_host_agent/test/backplane/host_agent/memory/capture_outage_contract_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/event_envelope_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/claude_code_hook_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/codex_hook_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/integration_plugin_contract_test.exs

      - name: Verify memory plugin source lifecycle
        run: |
          mix test \
            apps/backplane_memory_contract/test/backplane/openclaw_capture_contract_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/hermes_hook_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/openclaw_hook_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/spool_turso_test.exs

      # OpenClaw live acceptance removed until Plan 5 (new live tests).

      - name: Assemble host-agent package for provider contract tests
        env:
          MIX_ENV: prod
        run: |
          mix deps.get --only prod
          mix release host_agent --overwrite

      - name: Verify packaged Hermes provider
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          roots = list(Path('_build/prod/rel/host_agent/lib').glob(
              'backplane_host_agent-*/priv/integrations/memory'))
          if len(roots) != 1:
              raise SystemExit('expected one packaged memory integration directory')
          subprocess.run([
              sys.executable, '-B', '-m', 'unittest', 'discover',
              '-s', str(roots[0] / 'tests'), '-p', 'test_hermes*.py', '-v',
          ], check=True)
          PY

      - name: Verify packaged OpenClaw provider
        run: |
          roots=(_build/prod/rel/host_agent/lib/backplane_host_agent-*/priv/integrations/memory)
          test "${#roots[@]}" -eq 1
          node --test "${roots[0]}"/tests/test_openclaw*.mjs
