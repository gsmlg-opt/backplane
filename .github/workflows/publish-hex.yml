name: Publish Qualified Hex Packages

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Full 40-character qualified release SHA"
        required: true
        type: string
      version:
        description: "Qualified semantic version, without leading v"
        required: true
        type: string
      source_run_id:
        description: "Original Release workflow run ID"
        required: true
        type: string
      packages:
        description: "Packages to publish from the qualified source"
        required: true
        default: all
        type: choice
        options:
          - all
          - backplane_agent_runtime

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-hex-${{ inputs.version }}
  cancel-in-progress: false

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"
  MIX_ENV: prod
  SECRET_KEY_BASE: release_build_secret_key_base_for_ci_only_1234567890_release_build_secret

jobs:
  qualify:
    name: Verify original release qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      gated_sha: ${{ steps.gate.outputs.sha }}
      version: ${{ steps.gate.outputs.version }}
      package_matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - name: Require dispatch from main
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main

      # The verifier belongs to this workflow revision, not the older release SHA.
      - name: Checkout publication verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify qualified revision, jobs, release assets, and report hashes
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.revision }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: >-
          python3 scripts/verify_qualified_hex_publication.py
          --revision "$RELEASE_REVISION"
          --version "$RELEASE_VERSION"
          --source-run-id "$SOURCE_RUN_ID"

      - name: Select publication packages
        id: packages
        shell: bash
        env:
          PACKAGE_SELECTION: ${{ inputs.packages }}
        run: |
          case "$PACKAGE_SELECTION" in
            all)
              packages='["backplane_agent_runtime","backplane_ai_protocol","backplane_skill_protocol","backplane_mcp_protocol"]'
              ;;
            backplane_agent_runtime)
              packages='["backplane_agent_runtime"]'
              ;;
            *)
              echo "Unsupported package selection: $PACKAGE_SELECTION" >&2
              exit 1
              ;;
          esac
          echo "Selected Hex packages: $PACKAGE_SELECTION"
          python3 - "$packages" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          packages = [{"name": name, "path": f"apps/{name}"} for name in json.loads(sys.argv[1])]
          print("matrix=" + json.dumps({"package": packages}, separators=(",", ":")))
          PY

  hex-plugin-protocol:
    name: Publish backplane_plugin_protocol to Hex
    needs: qualify
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.qualify.outputs.gated_sha }}

      # Older qualified releases may predate the plugin package entirely.
      - name: Check plugin package availability
        id: package
        shell: bash
        env:
          PACKAGE_SELECTION: ${{ inputs.packages }}
        run: |
          present=false
          if [[ "$PACKAGE_SELECTION" == all && -f apps/backplane_plugin_protocol/mix.exs ]]; then
            present=true
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        if: steps.package.outputs.present == 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Validate package version
        if: steps.package.outputs.present == 'true'
        working-directory: apps/backplane_plugin_protocol
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read backplane_plugin_protocol version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match backplane_plugin_protocol version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish backplane_plugin_protocol to Hex" >&2
            exit 1
          fi

      - name: Install package publishing dependencies
        if: steps.package.outputs.present == 'true'
        working-directory: apps/backplane_plugin_protocol
        run: mix deps.get

      - name: Verify package documentation
        if: steps.package.outputs.present == 'true'
        working-directory: apps/backplane_plugin_protocol
        run: mix docs

      - name: Publish package
        if: steps.package.outputs.present == 'true'
        working-directory: apps/backplane_plugin_protocol
        run: mix hex.publish --yes

  hex-packages:
    name: Publish ${{ matrix.package.name }} to Hex
    needs:
      - qualify
      - hex-plugin-protocol
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.qualify.outputs.package_matrix) }}

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.qualify.outputs.gated_sha }}

      - name: Select package working directory
        shell: bash
        env:
          GATED_SHA: ${{ needs.qualify.outputs.gated_sha }}
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_PATH: ${{ matrix.package.path }}
        run: |
          package_directory="$GITHUB_WORKSPACE/$PACKAGE_PATH"
          if [[ "$PACKAGE_NAME" == backplane_agent_runtime ]]; then
            standalone_root="$(mktemp -d "$RUNNER_TEMP/backplane-hex.XXXXXX")"
            package_directory="$standalone_root/standalone/backplane_agent_runtime"
            mkdir -p "$package_directory"
            source_revision="$(git rev-parse --verify "${GATED_SHA}^{commit}")"
            test "$source_revision" = "$GATED_SHA"
            git archive "$source_revision:$PACKAGE_PATH" | tar -x -C "$package_directory"
            test ! -d "$standalone_root/apps"
            echo "QUALIFIED_HEX_SOURCE_REVISION=$source_revision"
            echo "QUALIFIED_HEX_PACKAGE=$PACKAGE_NAME"
            echo "QUALIFIED_HEX_STANDALONE=true"
          fi
          echo "PACKAGE_DIRECTORY=$package_directory" >> "$GITHUB_ENV"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        if: matrix.package.name != 'backplane_agent_runtime'
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: hex-${{ matrix.package.name }}-${{ hashFiles('mix.lock', format('{0}/mix.exs', matrix.package.path)) }}
          restore-keys: |
            hex-${{ matrix.package.name }}-

      - name: Install dependencies
        if: matrix.package.name != 'backplane_agent_runtime'
        run: mix deps.get

      - name: Validate package version
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read ${{ matrix.package.name }} version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match ${{ matrix.package.name }} version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish ${{ matrix.package.name }} to Hex" >&2
            exit 1
          fi

      - name: Install package publishing dependencies
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mix deps.get

      - name: Verify package documentation
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mix docs

      - name: Publish package
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mix hex.publish --yes
