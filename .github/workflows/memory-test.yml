name: Memory Test

on:
  push:
    paths:
      - "apps/backplane_memory/**"
      - "apps/backplane_memory_contract/**"
      - "apps/backplane_system/**"
      - "apps/backplane_api/**"
      - "apps/backplane_host_agent/**"
      - "apps/backplane_auth/**"
      - "apps/backplane_skills/**"
      - "apps/backplane_data_case/**"
      - "apps/*/mix.exs"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - "apps/backplane_admin/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build_web_assets.sh"
      - ".github/workflows/memory-test.yml"
  pull_request:
    paths:
      - "apps/backplane_memory/**"
      - "apps/backplane_memory_contract/**"
      - "apps/backplane_system/**"
      - "apps/backplane_api/**"
      - "apps/backplane_host_agent/**"
      - "apps/backplane_auth/**"
      - "apps/backplane_skills/**"
      - "apps/backplane_data_case/**"
      - "apps/*/mix.exs"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - "apps/backplane_admin/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build_web_assets.sh"
      - ".github/workflows/memory-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"
  MIX_ENV: test
  PGHOST: /var/run/postgresql

jobs:
  memory-test:
    name: Memory Test
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: deps
          key: memory-test-ubuntu26-v1-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs', 'package.json', 'package-lock.json') }}
          restore-keys: |
            memory-test-ubuntu26-v1-

      - name: Install dependencies
        run: mix deps.get

      - name: Start PostgreSQL 17 with pgvector
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-max-time 240 \
            --connect-timeout 15 --max-time 60 \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17 build-essential
          git clone --branch v0.8.0 --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config with_llvm=no
          sudo make -C /tmp/pgvector PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config with_llvm=no install
          sudo pg_ctlcluster 16 main stop || true
          sudo pg_dropcluster --stop 17 main || true
          sudo pg_createcluster 17 main --start --port 5432
          sudo -u postgres createuser --superuser "$USER" || true
          pg_isready -h "$PGHOST"

      - name: Prepare test database
        run: |
          mix ecto.create
          psql --dbname backplane_test --command "CREATE EXTENSION IF NOT EXISTS vector"
          mix ecto.migrate

      - name: Run Memory app tests
        run: mix do --app backplane_memory cmd mix test
