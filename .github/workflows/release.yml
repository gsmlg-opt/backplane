name: Release

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to release from"
        required: true
        default: "main"
        type: string
      version:
        description: "Release version, with or without leading v"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.git_ref }}-${{ inputs.version }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"
  MIX_ENV: prod
  SECRET_KEY_BASE: release_build_secret_key_base_for_ci_only_1234567890_release_build_secret

jobs:
  build:
    name: ${{ matrix.release }} (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - release: backplane
            target:
              name: linux-x64
              runner: ubuntu-24.04
          - release: backplane
            target:
              name: linux-arm64
              runner: ubuntu-24.04-arm
          - release: host_agent
            target:
              name: linux-x64
              runner: ubuntu-24.04
          - release: host_agent
            target:
              name: linux-arm64
              runner: ubuntu-24.04-arm
          - release: host_agent
            target:
              name: macos-x64
              runner: macos-15-intel
          - release: host_agent
            target:
              name: macos-arm64
              runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"

          if [[ -z "$version" ]]; then
            echo "Release version is required" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      - name: Configure OpenSSL for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pkg-config openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/prod
          key: release-${{ matrix.target.name }}-${{ matrix.release }}-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            release-${{ matrix.target.name }}-${{ matrix.release }}-
            release-${{ matrix.target.name }}-

      - name: Unify app versions
        run: bash scripts/set-version.sh "${{ steps.version.outputs.version }}"

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Install asset tools
        if: matrix.release == 'backplane'
        run: mix "do" --app backplane_api assets.setup && mix "do" --app backplane_admin assets.setup

      - name: Build web assets
        if: matrix.release == 'backplane'
        run: mix "do" --app backplane_api assets.deploy && mix "do" --app backplane_admin assets.deploy

      - name: Build OTP release
        run: mix release "${{ matrix.release }}" --overwrite --version "${{ steps.version.outputs.version }}"

      - name: Archive OTP release
        shell: bash
        run: |
          mkdir -p dist
          artifact="${{ matrix.release }}-${{ steps.version.outputs.version }}-${{ matrix.target.name }}.tar.gz"
          tar -czf "dist/$artifact" -C "_build/prod/rel" "${{ matrix.release }}"
          shasum -a 256 "dist/$artifact" > "dist/$artifact.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release }}-${{ matrix.target.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      commitish: ${{ steps.bump.outputs.commitish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"

          if [[ -z "$version" ]]; then
            echo "Release version is required" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Unify app versions
        run: bash scripts/set-version.sh "${{ steps.version.outputs.version }}"

      - name: Commit version bump
        id: bump
        shell: bash
        run: |
          if git diff --quiet; then
            echo "All mix.exs files already at ${{ steps.version.outputs.version }}; nothing to commit"
            echo "commitish=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.version.outputs.version }}"

          if git push origin "HEAD:refs/heads/${{ inputs.git_ref }}"; then
            echo "commitish=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "Could not push version bump to ${{ inputs.git_ref }} (not a branch?); releasing from the original ref" >&2
            echo "commitish=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare deploy docs and release notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist

          sed "s/{{VERSION}}/$version/g" docs/deploy/backplane.md > "dist/backplane-$version-deploy.md"
          sed "s/{{VERSION}}/$version/g" docs/deploy/host_agent.md > "dist/host_agent-$version-deploy.md"

          cat > release-notes-header.md <<EOF
          ## Deployment

          - **Backplane server** — see the attached \`backplane-$version-deploy.md\` (Docker and OTP release instructions).
          - **Host agent** — see the attached \`host_agent-$version-deploy.md\` (per-platform tarballs and YAML config).

          Docker image details are appended to these notes after the image is published.
          EOF

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.bump.outputs.commitish }}
          name: Backplane v${{ steps.version.outputs.version }}
          body_path: release-notes-header.md
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

  docker-image:
    name: Publish Docker Image
    needs: publish
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      git_ref: ${{ needs.publish.outputs.commitish }}
      image_tag: ghcr.io/gsmlg-dev/backplane:latest
      version: ${{ inputs.version }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  release-docker-info:
    name: Update release page with Docker info
    needs:
      - publish
      - docker-image
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Append Docker image info to release notes
        shell: bash
        run: |
          version="${{ needs.publish.outputs.version }}"
          release_tag="v$version"
          digest="${{ needs.docker-image.outputs.digest }}"
          tags="${{ needs.docker-image.outputs.tags }}"

          gh release view "$release_tag" -R "${{ github.repository }}" --json body -q .body > body.md

          {
            echo ""
            echo "## Docker image"
            echo ""
            echo '```sh'
            echo "docker pull ghcr.io/gsmlg-dev/backplane:$version"
            echo '```'
            echo ""
            echo "- Tags:"
            IFS=',' read -ra tag_list <<< "$tags"
            for image_tag in "${tag_list[@]}"; do
              echo "  - \`$image_tag\`"
            done
            echo "- Digest: \`$digest\`"
          } >> body.md

          gh release edit "$release_tag" -R "${{ github.repository }}" --notes-file body.md
