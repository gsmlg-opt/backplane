name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without leading v"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-main-${{ inputs.version }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"
  MIX_ENV: prod
  SECRET_KEY_BASE: release_build_secret_key_base_for_ci_only_1234567890_release_build_secret

jobs:
  qualify-memory-v2:
    name: Qualify Memory V2
    runs-on: ubuntu-24.04

    outputs:
      gated_sha: ${{ steps.gate.outputs.sha }}
      version: ${{ steps.gate.outputs.version }}

    env:
      MIX_ENV: test
      PGHOST: /var/run/postgresql

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/main

      - name: Resolve immutable release inputs
        id: gate
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Releases may only be dispatched from refs/heads/main" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION_INPUT" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release version must be a strict semantic version, optionally prefixed with v" >&2
            exit 1
          fi

          version="${RELEASE_VERSION_INPUT#v}"
          sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/main)"

          if [[ "$sha" != "$main_sha" ]]; then
            echo "Checked-out release SHA does not match origin/main" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: deps
          key: release-memory-v2-qualification-v2-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            release-memory-v2-qualification-v2-

      - name: Install dependencies
        run: mix deps.get

      - name: Start PostgreSQL 17 with pgvector
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17 build-essential
          git clone --branch v0.8.0 --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector with_llvm=no
          sudo make -C /tmp/pgvector with_llvm=no install
          sudo pg_ctlcluster 16 main stop || true
          sudo pg_dropcluster --stop 17 main || true
          sudo pg_createcluster 17 main --start --port 5432
          sudo -u postgres createuser --superuser "$USER" || true
          pg_isready -h "$PGHOST"

      - name: Verify root release configuration
        run: mix run --no-start test/release_config_test.exs

      - name: Prepare qualification database
        run: |
          mix ecto.create
          psql --dbname backplane_test --command "CREATE EXTENSION IF NOT EXISTS vector"
          mix ecto.migrate

      - name: Build admin assets for browser qualification
        run: |
          mix "do" --app backplane_admin assets.setup
          mix "do" --app backplane_admin assets.build

      - name: Verify M18 migration and rollback contracts
        run: |
          mix test \
            apps/backplane_memory/test/backplane/memory/m18_migration_chain_test.exs \
            apps/backplane_memory/test/backplane/memory/m18_migration_matrix_test.exs \
            apps/backplane_memory/test/backplane/memory/qualification_test.exs \
            --exclude memory_qualification_runtime

      - name: Verify outage, privacy, performance, and integration adapters
        run: |
          mix test \
            apps/backplane_host_agent/test/backplane/host_agent/memory/capture_outage_contract_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/capture_performance_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/event_envelope_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/claude_code_hook_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/codex_hook_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/integration_plugin_contract_test.exs \
            apps/backplane_api/test/backplane/api/memory_m18_outage_qualification_test.exs

      - name: Run guarded Memory V2 qualification and Recall V2 evaluation
        run: |
          mkdir -p artifacts/memory-v2
          mix memory.replay.browser_qualify \
            --report artifacts/memory-v2/memory-v2-replay-browser.json
          mix memory.seed_bench
          mix memory.eval \
            --report artifacts/memory-v2/memory-v2-eval.json \
            --longmemeval artifacts/memory-v2/memory-v2-longmemeval.jsonl \
            --sidecar artifacts/memory-v2/memory-v2-longmemeval-sidecar.json
          BACKPLANE_MEMORY_QUALIFICATION_REAL_POOL=true mix memory.qualify \
            --report artifacts/memory-v2/memory-v2-m18-qualification.json
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "qualification_tests=apps/backplane_memory/test/backplane/memory/qualification_test.exs"
            echo "outage_test=apps/backplane_api/test/backplane/api/memory_m18_outage_qualification_test.exs"
            sha256sum artifacts/memory-v2/memory-v2-*.json \
              artifacts/memory-v2/memory-v2-*.jsonl
          } > artifacts/memory-v2/qualification-manifest.txt

      - name: Upload Memory V2 qualification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-v2-qualification
          path: artifacts/memory-v2/
          if-no-files-found: warn
          retention-days: 90

  build:
    name: ${{ matrix.release }} (${{ matrix.target.name }})
    needs: qualify-memory-v2
    runs-on: ${{ matrix.target.runner }}

    env:
      GATED_SHA: ${{ needs.qualify-memory-v2.outputs.gated_sha }}
      RELEASE_VERSION: ${{ needs.qualify-memory-v2.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - release: backplane
            target:
              name: linux-x64
              runner: ubuntu-24.04
          - release: backplane
            target:
              name: linux-arm64
              runner: ubuntu-24.04-arm
          - release: host_agent
            target:
              name: linux-x64
              runner: ubuntu-22.04
          - release: host_agent
            target:
              name: linux-arm64
              runner: ubuntu-22.04-arm
          - release: host_agent
            target:
              name: macos-x64
              runner: macos-15-intel
          - release: host_agent
            target:
              name: macos-arm64
              runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.qualify-memory-v2.outputs.gated_sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      - name: Configure OpenSSL for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pkg-config openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/prod
          key: release-${{ matrix.target.runner }}-${{ matrix.target.name }}-${{ matrix.release }}-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            release-${{ matrix.target.runner }}-${{ matrix.target.name }}-${{ matrix.release }}-
            release-${{ matrix.target.runner }}-${{ matrix.target.name }}-

      - name: Unify app versions
        run: bash scripts/set-version.sh "$RELEASE_VERSION"

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Install asset tools
        if: matrix.release == 'backplane'
        run: mix "do" --app backplane_api assets.setup && mix "do" --app backplane_admin assets.setup

      - name: Build web assets
        if: matrix.release == 'backplane'
        run: mix "do" --app backplane_api assets.deploy && mix "do" --app backplane_admin assets.deploy

      - name: Build OTP release
        env:
          RELEASE_NAME: ${{ matrix.release }}
        run: mix release "$RELEASE_NAME" --overwrite --version "$RELEASE_VERSION"

      - name: Smoke test host-agent native database
        if: matrix.release == 'host_agent'
        run: |
          _build/prod/rel/host_agent/bin/host_agent eval '
            {:ok, _} = Application.ensure_all_started(:ex_turso)
            {:ok, pid} = Turso.start_link(database: ":memory:")
            {:ok, %Turso.Result{rows: [%{"value" => 1}]}} =
              Turso.query(pid, "SELECT 1 AS value")
            GenServer.stop(pid)
          '

      - name: Archive OTP release
        shell: bash
        env:
          RELEASE_NAME: ${{ matrix.release }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          mkdir -p dist
          artifact="$RELEASE_NAME-$RELEASE_VERSION-$TARGET_NAME.tar.gz"
          tar -czf "dist/$artifact" -C "_build/prod/rel" "$RELEASE_NAME"
          shasum -a 256 "dist/$artifact" > "dist/$artifact.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release }}-${{ matrix.target.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  installed-release-migration-smoke:
    name: Installed release database migration smoke
    needs: build
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backplane_release_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backplane_release_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Download Linux x64 Backplane release
        uses: actions/download-artifact@v7
        with:
          name: backplane-linux-x64
          path: dist

      - name: Extract installed release
        shell: bash
        run: |
          mkdir -p installed
          archive="$(find dist -maxdepth 1 -name 'backplane-*-linux-x64.tar.gz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C installed

      - name: Configure smoke database
        shell: bash
        run: |
          cat > release-smoke.toml <<'EOF'
          [database]
          url = "postgres://postgres:postgres@127.0.0.1:5432/backplane_release_smoke"
          EOF

      - name: Apply packaged migrations and prove idempotency
        env:
          BACKPLANE_CONFIG: ${{ github.workspace }}/release-smoke.toml
          SECRET_KEY_BASE: release_smoke_secret_key_base_for_ci_only_1234567890_release_smoke
        shell: bash
        run: |
          installed/backplane/bin/backplane eval '
          path = Application.app_dir(:backplane_system, "priv/repo/migrations")
          {:ok, versions, _apps} =
            Ecto.Migrator.with_repo(Backplane.Repo, fn repo ->
              Ecto.Migrator.run(repo, path, :up, all: true)
            end)
          if versions == [], do: raise("fresh installed release applied no migrations")
          '

          installed/backplane/bin/backplane eval '
          path = Application.app_dir(:backplane_system, "priv/repo/migrations")
          {:ok, versions, _apps} =
            Ecto.Migrator.with_repo(Backplane.Repo, fn repo ->
              Ecto.Migrator.run(repo, path, :up, all: true)
            end)
          if versions != [], do: raise("second installed migration pass was not a no-op")
          {:ok, :verified, _apps} =
            Ecto.Migrator.with_repo(Backplane.Repo, fn repo ->
              %Postgrex.Result{rows: [[last_version]]} =
                Ecto.Adapters.SQL.query!(repo, "SELECT max(version) FROM schema_migrations", [])
              %Postgrex.Result{rows: [[event_table, import_table]]} =
                Ecto.Adapters.SQL.query!(repo, "SELECT to_regclass('public.bpm_events') IS NOT NULL, to_regclass('public.memory_import_batches') IS NOT NULL", [])
              unless last_version == 20260812000022 and event_table and import_table,
                do: raise("installed migration inventory is incomplete")
              :verified
            end)
          '

  publish:
    name: Publish GitHub Release
    needs:
      - qualify-memory-v2
      - build
      - installed-release-migration-smoke
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    outputs:
      version: ${{ needs.qualify-memory-v2.outputs.version }}
      gated_sha: ${{ needs.qualify-memory-v2.outputs.gated_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.qualify-memory-v2.outputs.gated_sha }}

      - name: Unify app versions
        env:
          RELEASE_VERSION: ${{ needs.qualify-memory-v2.outputs.version }}
        run: bash scripts/set-version.sh "$RELEASE_VERSION"

      - name: Prepare deploy docs and release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.qualify-memory-v2.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          mkdir -p dist

          sed "s/{{VERSION}}/$version/g" docs/deploy/backplane.md > "dist/backplane-$version-deploy.md"
          sed "s/{{VERSION}}/$version/g" docs/deploy/host_agent.md > "dist/host_agent-$version-deploy.md"
          cp docs/operations/memory-v2.md "dist/memory-v2-operations.md"
          cp docs/deploy/memory-v2-release.md "dist/memory-v2-release.md"
          cp docs/qualification/memory-v2.md "dist/memory-v2-qualification.md"

          cat > release-notes-header.md <<EOF
          ## Deployment

          - **Backplane server** — see the attached \`backplane-$version-deploy.md\` (Docker and OTP release instructions).
          - **Host agent** — see the attached \`host_agent-$version-deploy.md\` (per-platform tarballs and YAML config).
          - **Memory V2** — see the attached operations, release/rollback, and qualification runbooks.

          Docker image details are appended to these notes after the image is published.
          EOF

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.qualify-memory-v2.outputs.version }}
          target_commitish: ${{ needs.qualify-memory-v2.outputs.gated_sha }}
          name: Backplane v${{ needs.qualify-memory-v2.outputs.version }}
          body_path: release-notes-header.md
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

  hex-package:
    name: Publish backplane_mcp_protocol to Hex
    needs: publish
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.gated_sha }}

      - name: Unify app versions
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: bash scripts/set-version.sh "$RELEASE_VERSION"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/dev
          key: hex-backplane-mcp-protocol-${{ hashFiles('mix.lock', 'apps/backplane_mcp_protocol/mix.exs') }}
          restore-keys: |
            hex-backplane-mcp-protocol-

      - name: Install dependencies
        run: mix deps.get

      - name: Validate package version
        working-directory: apps/backplane_mcp_protocol
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read backplane_mcp_protocol version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match backplane_mcp_protocol version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish backplane_mcp_protocol to Hex" >&2
            exit 1
          fi

      - name: Publish package
        working-directory: apps/backplane_mcp_protocol
        run: mix hex.publish --yes

  docker-image:
    name: Publish Docker Image
    needs:
      - publish
      - hex-package
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      git_ref: ${{ needs.publish.outputs.gated_sha }}
      image_tag: ghcr.io/gsmlg-dev/backplane:latest
      version: ${{ needs.publish.outputs.version }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  release-docker-info:
    name: Update release page with Docker info
    needs:
      - publish
      - docker-image
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Append Docker image info to release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          IMAGE_DIGEST: ${{ needs.docker-image.outputs.digest }}
          IMAGE_TAGS: ${{ needs.docker-image.outputs.tags }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="$RELEASE_VERSION"
          release_tag="v$version"
          digest="$IMAGE_DIGEST"
          tags="$IMAGE_TAGS"

          gh release view "$release_tag" -R "$REPOSITORY" --json body -q .body > body.md

          {
            echo ""
            echo "## Docker image"
            echo ""
            echo '```sh'
            echo "docker pull ghcr.io/gsmlg-dev/backplane:$version"
            echo '```'
            echo ""
            echo "- Tags:"
            IFS=',' read -ra tag_list <<< "$tags"
            for image_tag in "${tag_list[@]}"; do
              echo "  - \`$image_tag\`"
            done
            echo "- Digest: \`$digest\`"
          } >> body.md

          gh release edit "$release_tag" -R "$REPOSITORY" --notes-file body.md
