name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without leading v"
        required: true
        type: string
      release_apps:
        description: "all for unified OTP/Hex/Docker; comma-separated runtime app names for OTP/Docker only (must include backplane_host_agent)"
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"
  MIX_ENV: prod
  SECRET_KEY_BASE: release_build_secret_key_base_for_ci_only_1234567890_release_build_secret

jobs:
  prepare:
    name: Check release integrity
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      gated_sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.gate.outputs.version }}
      release_apps: ${{ steps.gate.outputs.release_apps }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve immutable release inputs
        id: gate
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_APPS_INPUT: ${{ inputs.release_apps }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Releases may only be dispatched from refs/heads/main" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION_INPUT" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release version must be a strict semantic version, optionally prefixed with v" >&2
            exit 1
          fi

          version="${RELEASE_VERSION_INPUT#v}"
          sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/main)"

          if [[ "$sha" != "$main_sha" ]]; then
            echo "Checked-out release SHA does not match origin/main" >&2
            exit 1
          fi

          release_apps="$RELEASE_APPS_INPUT"
          if [[ "$release_apps" != "all" ]]; then
            if [[ ! "$release_apps" =~ ^[a-z][a-z0-9_]*(,[a-z][a-z0-9_]*)*$ ]]; then
              echo "release_apps must be all or comma-separated runtime app names" >&2
              exit 1
            fi

            IFS=',' read -r -a selected_apps <<< "$release_apps"
            has_host_agent=false
            for app in "${selected_apps[@]}"; do
              if [[ ! -f "apps/$app/mix.exs" ]]; then
                echo "Unknown release app: $app" >&2
                exit 1
              fi

              case "$app" in
                backplane_plugin_protocol|backplane_agent_runtime|backplane_ai_protocol|backplane_skill_protocol|backplane_mcp_protocol|backplane_json_schema|backplane_schema)
                  echo "Selective runtime releases cannot publish Hex packages; use all" >&2
                  exit 1
                  ;;
                backplane_host_agent) has_host_agent=true ;;
              esac
            done

            if [[ "$has_host_agent" != "true" ]]; then
              echo "Selective runtime releases must include backplane_host_agent for integration packaging" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release_apps=$release_apps" >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      - name: Restore compilation cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/prod
          key: release-prepare-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            release-prepare-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile release source
        run: mix compile

      - name: Prepare the immutable release version commit
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_APPS: ${{ steps.gate.outputs.release_apps }}
        run: |
          IFS=',' read -r -a release_apps <<< "$RELEASE_APPS"
          bash scripts/set-version.sh "$RELEASE_VERSION" "${release_apps[@]}"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- mix.exs apps/*/mix.exs integrations/memory \
              apps/backplane_mcp_protocol/README.md apps/backplane_mcp_protocol/pages
            git commit -m "chore(release): prepare v${RELEASE_VERSION}"
            git push origin HEAD:refs/heads/main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web-assets:
    name: Build shared static assets
    needs: prepare
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.gated_sha }}
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: deps
          key: release-web-assets-ubuntu26-v1-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs', 'package.json', 'package-lock.json') }}
          restore-keys: |
            release-web-assets-ubuntu26-v1-

      - name: Install dependencies
        run: mix deps.get

      - name: Build web assets on the supported native build platform
        env:
          MIX_ENV: prod
          DUSKMOON_NATIVE_MODE: precompiled
          GATED_SHA: ${{ needs.prepare.outputs.gated_sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mix deps.compile
          mix npm.install --frozen
          mix assets.deploy
          elixir -pa _build/prod/lib/jason/ebin scripts/verify_web_assets.exs \
            --export . artifacts/web-assets "$GATED_SHA" "$RELEASE_VERSION"

      - name: Upload qualified static web assets
        uses: actions/upload-artifact@v7
        with:
          name: qualified-web-assets
          path: artifacts/web-assets/
          include-hidden-files: true
          if-no-files-found: error

  build:
    name: ${{ matrix.release }} (${{ matrix.target.name }})
    needs: [prepare, web-assets]
    runs-on: ${{ matrix.target.runner }}

    env:
      GATED_SHA: ${{ needs.prepare.outputs.gated_sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_APPS: ${{ needs.prepare.outputs.release_apps }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - release: backplane
            target:
              name: linux-x64
              runner: ubuntu-24.04
          - release: backplane
            target:
              name: linux-arm64
              runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.gated_sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/prod
          key: release-${{ matrix.target.runner }}-${{ matrix.target.name }}-${{ matrix.release }}-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs', 'package.json', 'package-lock.json') }}
          restore-keys: |
            release-${{ matrix.target.runner }}-${{ matrix.target.name }}-${{ matrix.release }}-
            release-${{ matrix.target.runner }}-${{ matrix.target.name }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile gateway dependencies
        if: matrix.release == 'backplane'
        run: mix deps.compile

      - name: Download qualified static web assets
        if: matrix.release == 'backplane'
        uses: actions/download-artifact@v8
        with:
          name: qualified-web-assets
          path: artifacts/web-assets

      - name: Import qualified web assets
        if: matrix.release == 'backplane'
        run: >-
          elixir -pa _build/prod/lib/jason/ebin scripts/verify_web_assets.exs
          --import artifacts/web-assets . "$GATED_SHA" "$RELEASE_VERSION"

      - name: Refresh compiled admin build metadata
        if: matrix.release == 'backplane'
        run: mix "do" --app backplane_admin loadpaths + compile.all --force --warnings-as-errors

      - name: Build optional Linux PTY helper
        if: runner.os == 'Linux' && matrix.release == 'backplane'
        run: mix backplane.pty.build

      - name: Build verified MCP stdio guardian
        if: matrix.release == 'backplane'
        run: mix backplane.mcp.stdio.build

      - name: Build OTP release
        env:
          RELEASE_NAME: ${{ matrix.release }}
        run: |
          rm -rf -- "_build/prod/rel/$RELEASE_NAME"
          mix release "$RELEASE_NAME" --overwrite --version "$RELEASE_VERSION"

      - name: Check packaged release inventory
        run: |
          test -x _build/prod/rel/backplane/bin/backplane
          test -d _build/prod/rel/backplane/releases/"$RELEASE_VERSION"
          helpers=(_build/prod/rel/backplane/lib/backplane_agent_runtime-*/priv/bin/backplane-local-command-pty)
          test "${#helpers[@]}" -eq 1 && test -x "${helpers[0]}"
          guardians=(_build/prod/rel/backplane/lib/backplane_mcp_protocol-*/priv/bin/backplane-mcp-stdio-guardian)
          test "${#guardians[@]}" -eq 1 && test -x "${guardians[0]}"
          elixir -pa _build/prod/lib/jason/ebin scripts/verify_web_assets.exs --release _build/prod/rel/backplane
          elixir -e '
            paths = Path.wildcard("_build/prod/rel/backplane/lib/backplane*-*/ebin/*.app")
            for required <- ["backplane.app", "backplane_admin.app"] do
              unless Enum.any?(paths, &(Path.basename(&1) == required)), do: raise("Missing #{required}")
            end
            for path <- paths do
              {:ok, [{:application, app, metadata}]} = :file.consult(String.to_charlist(path))
              selected = System.fetch_env!("RELEASE_APPS")
              if selected == "all" or Atom.to_string(app) in String.split(selected, ",") do
                unless to_string(Keyword.fetch!(metadata, :vsn)) == System.fetch_env!("RELEASE_VERSION") do
                  raise "Packaged application version mismatch: #{app}"
                end
              end
            end
          '

      - name: Archive OTP release
        shell: bash
        env:
          RELEASE_NAME: ${{ matrix.release }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          mkdir -p dist
          artifact="$RELEASE_NAME-$RELEASE_VERSION-$TARGET_NAME.tar.gz"
          tar -czf "dist/$artifact" -C "_build/prod/rel" "$RELEASE_NAME"
          shasum -a 256 "dist/$artifact" > "dist/$artifact.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release }}-${{ matrix.target.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  hex-preflight:
    name: Prepare Hex packages
    needs: prepare
    if: needs.prepare.outputs.release_apps == 'all'
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: dev
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.gated_sha }}
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Restore package build dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: release-hex-preflight-${{ hashFiles('mix.lock', 'apps/*/mix.exs') }}
      - name: Install dependencies
        run: mix deps.get --check-locked
      - name: Build packages and documentation before any publication
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/hex"
          for package in backplane_plugin_protocol backplane_json_schema backplane_schema backplane_mcp_protocol backplane_agent_runtime backplane_ai_protocol backplane_skill_protocol; do
            (
              cd "apps/$package"
              mix docs
              if [[ "$package" == backplane_agent_runtime || "$package" == backplane_mcp_protocol ]]; then
                standalone_root="$(mktemp -d "$RUNNER_TEMP/backplane-preflight.XXXXXX")"
                package_directory="$standalone_root/standalone/$package"
                mkdir -p "$package_directory"
                git archive "HEAD:apps/$package" | tar -x -C "$package_directory"
                cd "$package_directory"
              fi
              mix hex.build --output "$GITHUB_WORKSPACE/artifacts/hex/$package-$RELEASE_VERSION.tar"
            )
          done
      - name: Upload prepared Hex packages
        uses: actions/upload-artifact@v7
        with:
          name: qualified-hex-packages
          path: artifacts/hex/*.tar
          if-no-files-found: error
          retention-days: 30

  docker-build:
    name: Prepare Docker image
    needs: prepare
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      git_ref: ${{ needs.prepare.outputs.gated_sha }}
      image_tag: ghcr.io/gsmlg-dev/backplane:latest
      version: ${{ needs.prepare.outputs.version }}
      publish: false
      artifact_name: release-docker-image

  publish:
    name: Stage draft GitHub Release
    needs:
      - prepare
      - build
      - docker-build
      - hex-preflight
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.build.result == 'success' && needs.docker-build.result == 'success' &&
          (needs.hex-preflight.result == 'success' ||
           (needs.prepare.outputs.release_apps != 'all' && needs.hex-preflight.result == 'skipped')) }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    outputs:
      version: ${{ needs.prepare.outputs.version }}
      gated_sha: ${{ needs.prepare.outputs.gated_sha }}
      release_apps: ${{ needs.prepare.outputs.release_apps }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.gated_sha }}
          fetch-depth: 0

      - name: Prepare deploy docs and release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          mkdir -p dist

          sed "s/{{VERSION}}/$version/g" docs/deploy/backplane.md > "dist/backplane-$version-deploy.md"
          sed "s/{{VERSION}}/$version/g" docs/deploy/host_agent.md > "dist/host_agent-$version-deploy.md"
          cp docs/operations/memory.md "dist/memory-operations.md"
          cp docs/deploy/memory-release.md "dist/memory-release.md"
          cp docs/qualification/memory.md "dist/memory-qualification.md"
          cp docs/memory/host-memory-protocol.md "dist/host-memory-protocol.md"
          cp docs/operations/host-memory-edge-runbook.md "dist/host-memory-edge-runbook.md"

          cat > release-notes-header.md <<EOF
          ## Deployment

          - **Backplane server** — see the attached \`backplane-$version-deploy.md\` (Docker and OTP release instructions).
          - **Host agent** — see the attached \`host_agent-$version-deploy.md\` (per-platform tarballs and YAML config).
          - **Memory** — see the attached operations, release/rollback, and qualification runbooks.

          Docker image details are appended after publication.

          ## Host Agent

          <!-- host-agent-status:start -->
          Host Agent packages are built asynchronously after the main release. Status: pending.
          <!-- host-agent-status:end -->
          EOF

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'backplane-*'
          path: dist
          merge-multiple: true

      - name: Record core release manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.gated_sha }}
          RELEASE_APPS: ${{ needs.prepare.outputs.release_apps }}
        run: |
          python3 - <<'MANIFEST'
          import json, os
          from pathlib import Path
          manifest = {
              "schema_version": 1,
              "revision": os.environ["RELEASE_REVISION"],
              "workflow_revision": os.environ["GITHUB_SHA"],
              "version": os.environ["RELEASE_VERSION"],
              "source_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "release_apps": os.environ["RELEASE_APPS"],
              "host_agent": "async",
          }
          Path("dist/release-manifest.json").write_text(json.dumps(manifest, sort_keys=True) + "\n")
          MANIFEST
      - name: Upload core release manifest
        uses: actions/upload-artifact@v7
        with:
          name: core-release-manifest
          overwrite: true
          path: dist/release-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Stage immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.gated_sha }}
        run: python3 scripts/manage_release_assets.py stage --directory dist

  hex-plugin-protocol:
    name: Publish backplane_plugin_protocol to Hex
    needs: publish
    if: needs.publish.outputs.release_apps == 'all'
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.gated_sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Validate package version
        working-directory: apps/backplane_plugin_protocol
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read backplane_plugin_protocol version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match backplane_plugin_protocol version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish backplane_plugin_protocol to Hex" >&2
            exit 1
          fi

      - name: Install package publishing dependencies
        working-directory: apps/backplane_plugin_protocol
        run: mix deps.get

      - name: Verify package documentation
        working-directory: apps/backplane_plugin_protocol
        run: mix docs

      - name: Download prepared Hex packages
        uses: actions/download-artifact@v8
        with:
          name: qualified-hex-packages
          path: artifacts/hex

      - name: Publish package
        working-directory: apps/backplane_plugin_protocol
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: python3 "$GITHUB_WORKSPACE/scripts/publish_hex_package.py" "$GITHUB_WORKSPACE/artifacts/hex" "$RELEASE_VERSION"

  hex-mcp-protocol:
    name: Publish backplane_mcp_protocol to Hex
    needs:
      - publish
      - hex-plugin-protocol
      - hex-schema
    if: needs.publish.outputs.release_apps == 'all'
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.gated_sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Select standalone MCP package directory
        env:
          GATED_SHA: ${{ needs.publish.outputs.gated_sha }}
        run: |
          standalone_root="$(mktemp -d "$RUNNER_TEMP/backplane-mcp-hex.XXXXXX")"
          package_directory="$standalone_root/standalone/backplane_mcp_protocol"
          mkdir -p "$package_directory"
          git archive "$GATED_SHA:apps/backplane_mcp_protocol" | tar -x -C "$package_directory"
          echo "PACKAGE_DIRECTORY=$package_directory" >> "$GITHUB_ENV"

      - name: Validate package version
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read backplane_mcp_protocol version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match backplane_mcp_protocol version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish backplane_mcp_protocol to Hex" >&2
            exit 1
          fi

      - name: Install package publishing dependencies
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mix deps.get

      - name: Verify package documentation
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mix docs

      - name: Download prepared Hex packages
        uses: actions/download-artifact@v8
        with:
          name: qualified-hex-packages
          path: artifacts/hex

      - name: Publish package
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: python3 "$GITHUB_WORKSPACE/scripts/publish_hex_package.py" "$GITHUB_WORKSPACE/artifacts/hex" "$RELEASE_VERSION"

  hex-json-schema:
    name: Publish backplane_json_schema to Hex
    needs: publish
    if: needs.publish.outputs.release_apps == 'all'
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.gated_sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Validate package version
        working-directory: apps/backplane_json_schema
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read backplane_json_schema version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match backplane_json_schema version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish backplane_json_schema to Hex" >&2
            exit 1
          fi

      - name: Install package publishing dependencies
        working-directory: apps/backplane_json_schema
        run: mix deps.get

      - name: Verify package documentation
        working-directory: apps/backplane_json_schema
        run: mix docs

      - name: Download prepared Hex packages
        uses: actions/download-artifact@v8
        with:
          name: qualified-hex-packages
          path: artifacts/hex

      - name: Publish package
        working-directory: apps/backplane_json_schema
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: python3 "$GITHUB_WORKSPACE/scripts/publish_hex_package.py" "$GITHUB_WORKSPACE/artifacts/hex" "$RELEASE_VERSION"

  hex-schema:
    name: Publish backplane_schema to Hex
    needs: publish
    if: needs.publish.outputs.release_apps == 'all'
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.gated_sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Validate package version
        working-directory: apps/backplane_schema
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read backplane_schema version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match backplane_schema version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish backplane_schema to Hex" >&2
            exit 1
          fi

      - name: Install package publishing dependencies
        working-directory: apps/backplane_schema
        run: mix deps.get

      - name: Verify package documentation
        working-directory: apps/backplane_schema
        run: mix docs

      - name: Download prepared Hex packages
        uses: actions/download-artifact@v8
        with:
          name: qualified-hex-packages
          path: artifacts/hex

      - name: Publish package
        working-directory: apps/backplane_schema
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: python3 "$GITHUB_WORKSPACE/scripts/publish_hex_package.py" "$GITHUB_WORKSPACE/artifacts/hex" "$RELEASE_VERSION"

  hex-packages:
    name: Publish ${{ matrix.package.name }} to Hex
    needs:
      - publish
      - hex-plugin-protocol
      - hex-mcp-protocol
      - hex-json-schema
      - hex-schema
    if: needs.publish.outputs.release_apps == 'all'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: backplane_agent_runtime
            path: apps/backplane_agent_runtime
          - name: backplane_ai_protocol
            path: apps/backplane_ai_protocol
          - name: backplane_skill_protocol
            path: apps/backplane_skill_protocol

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.gated_sha }}

      - name: Select package working directory
        shell: bash
        env:
          GATED_SHA: ${{ needs.publish.outputs.gated_sha }}
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_PATH: ${{ matrix.package.path }}
        run: |
          package_directory="$GITHUB_WORKSPACE/$PACKAGE_PATH"
          if [[ "$PACKAGE_NAME" == backplane_agent_runtime ]]; then
            standalone_root="$(mktemp -d "$RUNNER_TEMP/backplane-hex.XXXXXX")"
            package_directory="$standalone_root/standalone/backplane_agent_runtime"
            mkdir -p "$package_directory"
            source_revision="$(git rev-parse --verify "${GATED_SHA}^{commit}")"
            test "$source_revision" = "$GATED_SHA"
            git archive "$source_revision:$PACKAGE_PATH" | tar -x -C "$package_directory"
            # Preserve the release version set by the preceding version script.
            cp "$GITHUB_WORKSPACE/$PACKAGE_PATH/mix.exs" "$package_directory/mix.exs"
            test ! -d "$standalone_root/apps"
            echo "QUALIFIED_HEX_SOURCE_REVISION=$source_revision"
            echo "QUALIFIED_HEX_PACKAGE=$PACKAGE_NAME"
            echo "QUALIFIED_HEX_STANDALONE=true"
          fi
          echo "PACKAGE_DIRECTORY=$package_directory" >> "$GITHUB_ENV"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        if: matrix.package.name != 'backplane_agent_runtime'
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: hex-${{ matrix.package.name }}-${{ hashFiles('mix.lock', format('{0}/mix.exs', matrix.package.path)) }}
          restore-keys: |
            hex-${{ matrix.package.name }}-

      - name: Install dependencies
        if: matrix.package.name != 'backplane_agent_runtime'
        run: mix deps.get

      - name: Validate package version
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read ${{ matrix.package.name }} version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match ${{ matrix.package.name }} version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish ${{ matrix.package.name }} to Hex" >&2
            exit 1
          fi

      - name: Install package publishing dependencies
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mix deps.get

      - name: Verify package documentation
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mix docs

      - name: Download prepared Hex packages
        uses: actions/download-artifact@v8
        with:
          name: qualified-hex-packages
          path: artifacts/hex

      - name: Publish package
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: python3 "$GITHUB_WORKSPACE/scripts/publish_hex_package.py" "$GITHUB_WORKSPACE/artifacts/hex" "$RELEASE_VERSION"

  docker-image:
    name: Publish Docker Image
    needs:
      - publish
      - hex-packages
    if: >-
      ${{ !cancelled() &&
          needs.publish.result == 'success' &&
          (needs.hex-packages.result == 'success' ||
           (needs.publish.outputs.release_apps != 'all' &&
            needs.hex-packages.result == 'skipped')) }}
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      git_ref: ${{ needs.publish.outputs.gated_sha }}
      image_tag: ghcr.io/gsmlg-dev/backplane:latest
      version: ${{ needs.publish.outputs.version }}
      publish: true
      artifact_name: release-docker-image
      source_run_id: ${{ github.run_id }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  finalize:
    name: Publish complete main release
    needs: [publish, hex-packages, docker-image]
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' &&
          needs.docker-image.result == 'success' &&
          (needs.hex-packages.result == 'success' ||
           (needs.publish.outputs.release_apps != 'all' && needs.hex-packages.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ needs.publish.outputs.version }}
      gated_sha: ${{ needs.publish.outputs.gated_sha }}
    steps:
      - name: Checkout release publisher
        uses: actions/checkout@v7
      - name: Verify core assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_REVISION: ${{ needs.publish.outputs.gated_sha }}
          IMAGE_DIGEST: ${{ needs.docker-image.outputs.digest }}
        run: python3 scripts/manage_release_assets.py finalize

  dispatch-host-agent:
    name: Schedule asynchronous Host Agent builds
    needs: finalize
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch Host Agent publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.finalize.outputs.version }}
          RELEASE_REVISION: ${{ needs.finalize.outputs.gated_sha }}
        run: |
          gh workflow run host-agent-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version="$RELEASE_VERSION" -f revision="$RELEASE_REVISION"
