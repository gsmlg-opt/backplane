name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without leading v"
        required: true
        type: string
      release_apps:
        description: "all for unified OTP/Hex/Docker; comma-separated runtime app names for OTP/Docker only (must include backplane_host_agent)"
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-main-${{ inputs.version }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"
  MIX_ENV: prod
  SECRET_KEY_BASE: release_build_secret_key_base_for_ci_only_1234567890_release_build_secret

jobs:
  qualify-memory-v2:
    name: Qualify Memory V2
    runs-on: ubuntu-26.04

    outputs:
      gated_sha: ${{ steps.gate.outputs.sha }}
      version: ${{ steps.gate.outputs.version }}
      release_apps: ${{ steps.gate.outputs.release_apps }}

    env:
      MIX_ENV: test
      PGHOST: /var/run/postgresql

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main

      - name: Resolve immutable release inputs
        id: gate
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_APPS_INPUT: ${{ inputs.release_apps }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Releases may only be dispatched from refs/heads/main" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION_INPUT" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release version must be a strict semantic version, optionally prefixed with v" >&2
            exit 1
          fi

          version="${RELEASE_VERSION_INPUT#v}"
          sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/main)"

          if [[ "$sha" != "$main_sha" ]]; then
            echo "Checked-out release SHA does not match origin/main" >&2
            exit 1
          fi

          release_apps="$RELEASE_APPS_INPUT"
          if [[ "$release_apps" != "all" ]]; then
            if [[ ! "$release_apps" =~ ^[a-z][a-z0-9_]*(,[a-z][a-z0-9_]*)*$ ]]; then
              echo "release_apps must be all or comma-separated runtime app names" >&2
              exit 1
            fi

            IFS=',' read -r -a selected_apps <<< "$release_apps"
            has_host_agent=false
            for app in "${selected_apps[@]}"; do
              if [[ ! -f "apps/$app/mix.exs" ]]; then
                echo "Unknown release app: $app" >&2
                exit 1
              fi

              case "$app" in
                backplane_plugin_protocol|backplane_agent_runtime|backplane_ai_protocol|backplane_skill_protocol|backplane_mcp_protocol)
                  echo "Selective runtime releases cannot publish Hex packages; use all" >&2
                  exit 1
                  ;;
                backplane_host_agent) has_host_agent=true ;;
              esac
            done

            if [[ "$has_host_agent" != "true" ]]; then
              echo "Selective runtime releases must include backplane_host_agent for integration packaging" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release_apps=$release_apps" >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: deps
          key: release-memory-v2-qualification-ubuntu26-v3-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs', 'package.json', 'package-lock.json') }}
          restore-keys: |
            release-memory-v2-qualification-ubuntu26-v3-

      - name: Install dependencies
        run: mix deps.get

      - name: Start PostgreSQL 17 with pgvector
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17 build-essential
          git clone --branch v0.8.0 --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config with_llvm=no
          sudo make -C /tmp/pgvector PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config with_llvm=no install
          sudo pg_ctlcluster 16 main stop || true
          sudo pg_dropcluster --stop 17 main || true
          sudo pg_createcluster 17 main --start --port 5432
          sudo -u postgres createuser --superuser "$USER" || true
          pg_isready -h "$PGHOST"

      - name: Verify root release configuration
        run: mix run --no-start test/release_config_test.exs

      - name: Verify Hex publication dependencies
        run: mix run --no-start test/hex_release_dependencies_test.exs

      - name: Verify web asset build orchestration
        run: |
          elixir test/build_web_assets_script_test.exs
          mix run --no-start test/web_assets_test.exs

      - name: Verify Hermes provider contract
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover
          -s integrations/memory/tests -p 'test_hermes*.py' -v

      - name: Set up qualified OpenClaw Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"

      - name: Verify OpenClaw provider contract
        run: node --test integrations/memory/tests/test_openclaw*.mjs

      - name: Verify Hermes live semantic oracle
        run: MIX_ENV=test mix run --no-start test/hermes_memory_live_oracle_test.exs

      - name: Prepare qualification database
        run: |
          mix ecto.create
          psql --dbname backplane_test --command "CREATE EXTENSION IF NOT EXISTS vector"
          mix ecto.migrate

      # Migration 20260525000050 creates eight empty legacy slots without a
      # host. Resolve only those exact fresh-install fixtures in this CI database;
      # real installations must investigate their own backfill issues.
      - name: Resolve migration-seeded empty memory slots in the qualification database
        run: |
          psql -X -v ON_ERROR_STOP=1 --dbname backplane_test <<'SQL'
          DO $qualification$
          DECLARE
            names text[];
            issues integer;
            removed integer;
            settled integer;
          BEGIN
            SELECT array_agg(name ORDER BY name) INTO names FROM memory_slots;
            IF names IS DISTINCT FROM ARRAY[
              'guidance', 'pending_items', 'persona', 'project_context',
              'self_notes', 'session_patterns', 'tool_guidelines', 'user_preferences'
            ]::text[] OR EXISTS (
              SELECT 1 FROM memory_slots
              WHERE content <> '' OR updated_by IS NOT NULL OR size_limit_chars <> 2000
                 OR host_id IS NOT NULL OR client_id IS NOT NULL
                 OR source_client_id IS NOT NULL OR memory_space_id IS NOT NULL
                 OR scope IS NOT NULL OR namespace IS NOT NULL
            ) THEN
              RAISE EXCEPTION 'unexpected legacy slot data in fresh qualification database';
            END IF;

            SELECT count(*) INTO issues
            FROM bpm_memory_space_backfill_issues issue
            JOIN memory_slots slot
              ON issue.source_id = bpm_memory_backfill_source_id('memory_slots', to_jsonb(slot))
            WHERE issue.source_table = 'memory_slots' AND issue.reason = 'missing_mapping'
              AND issue.disposition = 'pending';
            IF issues <> 8 OR (SELECT count(*) FROM bpm_memory_space_backfill_issues) <> 8 THEN
              RAISE EXCEPTION 'unexpected backfill issues in fresh qualification database';
            END IF;

            WITH deleted AS (
              DELETE FROM memory_slots AS slot
              RETURNING bpm_memory_backfill_source_id('memory_slots', to_jsonb(slot)) AS source_id
            ), resolved AS (
              UPDATE bpm_memory_space_backfill_issues AS issue
              SET disposition = 'resolved', resolved_at = now(), updated_at = now()
              FROM deleted
              WHERE issue.source_table = 'memory_slots' AND issue.source_id = deleted.source_id
                AND issue.disposition = 'pending'
              RETURNING issue.source_id
            )
            SELECT (SELECT count(*) FROM deleted), (SELECT count(*) FROM resolved)
            INTO removed, settled;
            IF removed <> 8 OR settled <> 8 THEN
              RAISE EXCEPTION 'fresh qualification slot resolution was incomplete';
            END IF;
          END
          $qualification$;
          SQL

      - name: Verify revisioned edge cutover readiness
        run: mix backplane.memory.edge_cutover_check

      - name: Build web assets on the supported native build platform
        env:
          MIX_ENV: prod
          DUSKMOON_NATIVE_MODE: precompiled
          GATED_SHA: ${{ steps.gate.outputs.sha }}
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          mix deps.compile
          mix npm.install --frozen
          mix assets.deploy
          elixir -pa _build/prod/lib/jason/ebin scripts/verify_web_assets.exs \
            --export . artifacts/web-assets "$GATED_SHA" "$RELEASE_VERSION"

      - name: Upload qualified static web assets
        uses: actions/upload-artifact@v7
        with:
          name: qualified-web-assets
          path: artifacts/web-assets/
          include-hidden-files: true
          if-no-files-found: error

      - name: Verify Memory V2 migration, upgrade, and projection repair contracts
        run: |
          mix test \
            apps/backplane_memory/test/backplane/memory/m18_migration_chain_test.exs \
            apps/backplane_memory/test/backplane/memory/m18_migration_matrix_test.exs \
            apps/backplane_memory/test/backplane/memory/qualification_test.exs \
            apps/backplane_memory/test/backplane/memory/readiness_test.exs \
            apps/backplane_memory/test/backplane/memory/memory_v2_upgrade_test.exs \
            apps/backplane_memory/test/backplane/memory/projections/coalesce_projection_repairs_migration_test.exs \
            apps/backplane_memory/test/backplane/memory/projections/projection_repair_worker_test.exs \
            --exclude memory_qualification_runtime

      - name: Verify outage, privacy, performance, and integration adapters
        run: |
          mix test \
            apps/backplane_host_agent/test/backplane/host_agent/memory/capture_outage_contract_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/event_envelope_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/claude_code_hook_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/codex_hook_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/integration_plugin_contract_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/v1_to_v2_upgrade_test.exs \
            apps/backplane_api/test/backplane/api/memory_m18_outage_qualification_test.exs \
            apps/backplane_api/test/backplane/api/memory_v2_edge_qualification_test.exs

      - name: Verify Hermes source lifecycle
        run: |
          mix test \
            apps/backplane_memory_contract/test/backplane/memory_source_contract_test.exs \
            apps/backplane_memory_contract/test/backplane/openclaw_capture_contract_test.exs \
            apps/backplane_memory/test/backplane/memory/sources_test.exs \
            apps/backplane_memory/test/backplane/memory/source_commands_test.exs \
            apps/backplane_memory/test/backplane/memory/fact_extraction_test.exs \
            apps/backplane_memory/test/backplane/memory/llm_test.exs \
            apps/backplane_memory/test/backplane/memory/workers/hermes_pipeline_test.exs \
            apps/backplane_memory/test/backplane/memory/workers/episodic_worker_test.exs \
            apps/backplane_memory/test/backplane/memory/memories/evidence_test.exs \
            apps/backplane_memory/test/backplane/memory/memories/evidence_concurrency_test.exs \
            apps/backplane_memory/test/backplane/memory/recall/relevance_test.exs \
            apps/backplane_memory/test/backplane/memory/recall/fusion_test.exs \
            apps/backplane_memory/test/backplane/memory/recall/retriever_test.exs \
            apps/backplane_memory/test/backplane/memory/recall/pipeline_test.exs \
            apps/backplane_memory/test/backplane/memory/recall/selection_test.exs \
            apps/backplane_memory/test/backplane/memory/recall/channels_test.exs \
            apps/backplane_memory/test/backplane/memory/recall/query_plan_test.exs \
            apps/backplane_memory/test/backplane/memory/exact_read_test.exs \
            apps/backplane_memory/test/backplane/memory/config_test.exs \
            apps/backplane_memory/test/backplane/memory/service_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/access_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/hermes_hook_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/openclaw_hook_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/spool_turso_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory/context_packer_test.exs \
            apps/backplane_host_agent/test/backplane/host_agent/memory_facade_test.exs \
            apps/backplane_api/test/backplane/api/host_agent_memory_sync_test.exs

      - name: Install pinned OpenClaw qualification runtime
        run: npm install --prefix "$RUNNER_TEMP/backplane-openclaw-runtime" --no-audit --no-fund openclaw@2026.10.7

      - name: Verify real OpenClaw canonical path
        env:
          BACKPLANE_MEMORY_QUALIFICATION_REAL_POOL: "1"
          OPENCLAW_LIVE_MODE: deterministic
          OPENROUTER_API_KEY: ""
        run: |
          mkdir -p artifacts/openclaw
          OPENCLAW_NODE="$(command -v node)" \
          OPENCLAW_RUNTIME="$RUNNER_TEMP/backplane-openclaw-runtime/node_modules/openclaw" \
          MIX_TEST_PARTITION="_openclawlive_$(openssl rand -hex 8)" \
            mix run --no-start test/openclaw_memory_live_acceptance.exs \
            > artifacts/openclaw/openclaw-live.log

      - name: Run guarded Memory V2 qualification and Recall V2 evaluation
        run: |
          mkdir -p artifacts/memory-v2
          mix memory.replay.browser_qualify \
            --report artifacts/memory-v2/memory-v2-replay-browser.json
          mix memory.seed_bench
          mix memory.eval \
            --profile ci \
            --report artifacts/memory-v2/memory-v2-eval-ci-smoke.json \
            --longmemeval artifacts/memory-v2/memory-v2-longmemeval.jsonl \
            --sidecar artifacts/memory-v2/memory-v2-longmemeval-sidecar.json
          BACKPLANE_MEMORY_QUALIFICATION_REAL_POOL=true mix memory.qualify \
            --profile ci \
            --report artifacts/memory-v2/memory-v2-m18-ci-smoke.json
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "qualification_tests=apps/backplane_memory/test/backplane/memory/qualification_test.exs"
            echo "outage_test=apps/backplane_api/test/backplane/api/memory_m18_outage_qualification_test.exs"
            sha256sum artifacts/memory-v2/memory-v2-*.json \
              artifacts/memory-v2/memory-v2-*.jsonl
          } > artifacts/memory-v2/qualification-manifest.txt

      - name: Upload Memory V2 qualification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-v2-qualification
          path: artifacts/memory-v2/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload OpenClaw memory qualification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-memory-qualification
          path: artifacts/openclaw/
          if-no-files-found: warn
          retention-days: 90

  build:
    name: ${{ matrix.release }} (${{ matrix.target.name }})
    needs: qualify-memory-v2
    runs-on: ${{ matrix.target.runner }}

    env:
      GATED_SHA: ${{ needs.qualify-memory-v2.outputs.gated_sha }}
      RELEASE_VERSION: ${{ needs.qualify-memory-v2.outputs.version }}
      RELEASE_APPS: ${{ needs.qualify-memory-v2.outputs.release_apps }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - release: backplane
            target:
              name: linux-x64
              runner: ubuntu-24.04
          - release: backplane
            target:
              name: linux-arm64
              runner: ubuntu-24.04-arm
          - release: host_agent
            target:
              name: linux-x64
              runner: ubuntu-22.04
          - release: host_agent
            target:
              name: linux-arm64
              runner: ubuntu-22.04-arm
          - release: host_agent
            target:
              name: macos-x64
              runner: macos-15-intel
          - release: host_agent
            target:
              name: macos-arm64
              runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.qualify-memory-v2.outputs.gated_sha }}

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      - name: Configure OpenSSL for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pkg-config openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/prod
          key: release-${{ matrix.target.runner }}-${{ matrix.target.name }}-${{ matrix.release }}-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs', 'package.json', 'package-lock.json') }}
          restore-keys: |
            release-${{ matrix.target.runner }}-${{ matrix.target.name }}-${{ matrix.release }}-
            release-${{ matrix.target.runner }}-${{ matrix.target.name }}-

      - name: Set selected app versions
        shell: bash
        run: |
          IFS=',' read -r -a release_apps <<< "$RELEASE_APPS"
          bash scripts/set-version.sh "$RELEASE_VERSION" "${release_apps[@]}"

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.release }}" == "backplane" ]]; then
            mix deps.get
          else
            mix deps.get --only prod
          fi

      - name: Compile gateway dependencies
        if: matrix.release == 'backplane'
        run: mix deps.compile

      - name: Download qualified static web assets
        if: matrix.release == 'backplane'
        uses: actions/download-artifact@v8
        with:
          name: qualified-web-assets
          path: artifacts/web-assets

      - name: Import qualified web assets
        if: matrix.release == 'backplane'
        run: >-
          elixir -pa _build/prod/lib/jason/ebin scripts/verify_web_assets.exs
          --import artifacts/web-assets . "$GATED_SHA" "$RELEASE_VERSION"

      - name: Refresh compiled admin build metadata
        if: matrix.release == 'backplane'
        run: mix "do" --app backplane_admin loadpaths + compile.all --force --warnings-as-errors

      - name: Build optional Linux PTY helper
        if: runner.os == 'Linux' && matrix.release == 'backplane'
        run: mix backplane.pty.build

      - name: Build verified MCP stdio guardian
        if: matrix.release == 'backplane'
        run: mix backplane.mcp.stdio.build

      - name: Build OTP release
        env:
          RELEASE_NAME: ${{ matrix.release }}
        run: |
          rm -rf -- "_build/prod/rel/$RELEASE_NAME"
          mix release "$RELEASE_NAME" --overwrite --version "$RELEASE_VERSION"

      - name: Verify packaged Linux PTY helper
        if: runner.os == 'Linux' && matrix.release == 'backplane'
        env:
          RELEASE_NAME: ${{ matrix.release }}
        run: |
          helpers=("_build/prod/rel/$RELEASE_NAME"/lib/backplane_agent_runtime-*/priv/bin/backplane-local-command-pty)
          test "${#helpers[@]}" -eq 1
          test -x "${helpers[0]}"
          "${helpers[0]}" --probe

      - name: Verify packaged MCP stdio guardian
        if: matrix.release == 'backplane'
        env:
          RELEASE_NAME: ${{ matrix.release }}
        run: |
          helpers=("_build/prod/rel/$RELEASE_NAME"/lib/backplane_mcp_protocol-*/priv/bin/backplane-mcp-stdio-guardian)
          test "${#helpers[@]}" -eq 1
          test -x "${helpers[0]}"
          test "$("${helpers[0]}" --probe)" = "backplane-mcp-stdio-guardian 1"

      - name: Verify compiled release metadata
        if: matrix.release == 'backplane'
        env:
          RELEASE_DISTRIBUTION: none
        run: |
          _build/prod/rel/backplane/bin/backplane eval '
            Enum.each(
              ~w(BACKPLANE_GIT_REF BACKPLANE_GIT_SHA VCS_REF BACKPLANE_BUILD_DATE BACKPLANE_RELEASE_DATE),
              &System.delete_env/1
            )
            info = Backplane.Admin.BuildInfo.current()
            expected = %{
              version: System.fetch_env!("RELEASE_VERSION"),
              git_sha: System.fetch_env!("GATED_SHA"),
              environment: "prod"
            }
            unless Map.take(info, Map.keys(expected)) == expected do
              raise "Release build metadata mismatch: #{inspect(info)}; expected #{inspect(expected)}"
            end
          '

      - name: Verify packaged web assets
        if: matrix.release == 'backplane'
        run: elixir -pa _build/prod/lib/jason/ebin scripts/verify_web_assets.exs --release _build/prod/rel/backplane

      - name: Verify packaged web assets
        if: matrix.release == 'backplane'
        run: mix run --no-start scripts/verify_web_assets.exs --release _build/prod/rel/backplane

      - name: Smoke test host-agent native database
        if: matrix.release == 'host_agent'
        run: |
          _build/prod/rel/host_agent/bin/host_agent eval '
            {:ok, _} = Application.ensure_all_started(:ex_turso)
            {:ok, pid} = Turso.start_link(database: ":memory:")
            {:ok, %Turso.Result{rows: [%{"value" => 1}]}} =
              Turso.query(pid, "SELECT 1 AS value")
            GenServer.stop(pid)
          '

      # The pinned Hermes source requires Python >=3.11; Ubuntu 22.04 ships 3.10.
      - name: Set up Python for Hermes contract tests
        if: matrix.release == 'host_agent'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify packaged Hermes provider
        if: matrix.release == 'host_agent'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          roots = list(Path('_build/prod/rel/host_agent/lib').glob(
              'backplane_host_agent-*/priv/integrations/memory'))
          if len(roots) != 1:
              raise SystemExit('expected one packaged memory integration directory')
          subprocess.run([
              sys.executable, '-B', '-m', 'unittest', 'discover',
              '-s', str(roots[0] / 'tests'), '-p', 'test_hermes*.py', '-v',
          ], check=True)
          PY

      - name: Set up qualified OpenClaw Node runtime
        if: matrix.release == 'host_agent'
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"

      - name: Verify packaged OpenClaw provider
        if: matrix.release == 'host_agent'
        run: |
          roots=(_build/prod/rel/host_agent/lib/backplane_host_agent-*/priv/integrations/memory)
          test "${#roots[@]}" -eq 1
          node --test "${roots[0]}"/tests/test_openclaw*.mjs

      - name: Archive OTP release
        shell: bash
        env:
          RELEASE_NAME: ${{ matrix.release }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          mkdir -p dist
          artifact="$RELEASE_NAME-$RELEASE_VERSION-$TARGET_NAME.tar.gz"
          tar -czf "dist/$artifact" -C "_build/prod/rel" "$RELEASE_NAME"
          shasum -a 256 "dist/$artifact" > "dist/$artifact.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release }}-${{ matrix.target.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  installed-release-migration-smoke:
    name: Installed release database migration smoke
    needs:
      - qualify-memory-v2
      - build
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backplane_release_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backplane_release_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout authoritative migration inventory
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.qualify-memory-v2.outputs.gated_sha }}

      - name: Download Linux x64 Backplane release
        uses: actions/download-artifact@v8
        with:
          name: backplane-linux-x64
          path: dist

      - name: Extract installed release
        shell: bash
        run: |
          mkdir -p installed
          archive="$(find dist -maxdepth 1 -name 'backplane-*-linux-x64.tar.gz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C installed

      - name: Configure smoke database
        shell: bash
        run: |
          cat > release-smoke.toml <<'EOF'
          [database]
          url = "postgres://postgres:postgres@127.0.0.1:5432/backplane_release_smoke"
          EOF

      - name: Apply packaged migrations and prove idempotency
        env:
          BACKPLANE_CONFIG: ${{ github.workspace }}/release-smoke.toml
          SECRET_KEY_BASE: release_smoke_secret_key_base_for_ci_only_1234567890_release_smoke
        shell: bash
        run: |
          latest_migration="$(
            find apps/backplane_system/priv/repo/migrations \
              -maxdepth 1 -type f -name '[0-9]*_*.exs' -print \
              | sort \
              | tail -n 1
          )"
          latest_migration="${latest_migration##*/}"
          expected_latest_migration="${latest_migration%%_*}"

          if [[ ! "$expected_latest_migration" =~ ^[0-9]{14}$ ]]; then
            echo "Could not derive authoritative latest migration version" >&2
            exit 1
          fi

          packaged_latest_migration="$(
            find installed/backplane/lib \
              -path '*/backplane_system-*/priv/repo/migrations/*' \
              -name "$latest_migration" -print -quit
          )"

          if [[ -z "$packaged_latest_migration" ]]; then
            echo "Installed release is missing authoritative migration $latest_migration" >&2
            exit 1
          fi

          export EXPECTED_LATEST_MIGRATION="$expected_latest_migration"

          installed/backplane/bin/backplane eval '
          path = Application.app_dir(:backplane_system, "priv/repo/migrations")
          {:ok, versions, _apps} =
            Ecto.Migrator.with_repo(Backplane.Repo, fn repo ->
              Ecto.Migrator.run(repo, path, :up, all: true)
            end)
          if versions == [], do: raise("fresh installed release applied no migrations")
          '

          installed/backplane/bin/backplane eval '
          path = Application.app_dir(:backplane_system, "priv/repo/migrations")
          {:ok, versions, _apps} =
            Ecto.Migrator.with_repo(Backplane.Repo, fn repo ->
              Ecto.Migrator.run(repo, path, :up, all: true)
            end)
          if versions != [], do: raise("second installed migration pass was not a no-op")
          {:ok, :verified, _apps} =
            Ecto.Migrator.with_repo(Backplane.Repo, fn repo ->
              expected_latest_migration =
                System.fetch_env!("EXPECTED_LATEST_MIGRATION") |> String.to_integer()

              %Postgrex.Result{rows: [[last_version]]} =
                Ecto.Adapters.SQL.query!(repo, "SELECT max(version) FROM schema_migrations", [])
              required_tables = [
                "public.bpm_events",
                "public.memory_import_batches",
                "public.bpm_memory_spaces",
                "public.bpm_memory_changes"
              ]

              missing_tables =
                Enum.reject(required_tables, fn table ->
                  %Postgrex.Result{rows: [[exists?]]} =
                    Ecto.Adapters.SQL.query!(repo, "SELECT to_regclass($1) IS NOT NULL", [table])

                  exists?
                end)

              unless last_version == expected_latest_migration and missing_tables == [] do
                raise(
                  "installed migration inventory is incomplete: " <>
                    "expected latest #{expected_latest_migration}, got #{inspect(last_version)}, " <>
                    "missing tables #{inspect(missing_tables)}"
                )
              end

              :verified
            end)
          '

      - name: Verify installed web assets over HTTP
        env:
          BACKPLANE_CONFIG: ${{ github.workspace }}/release-smoke.toml
          SECRET_KEY_BASE: release_smoke_secret_key_base_for_ci_only_1234567890_release_smoke
          PHX_SERVER: "true"
          BACKPLANE_API_PORT: "14100"
          BACKPLANE_ADMIN_PORT: "14101"
        shell: bash
        run: |
          installed/backplane/bin/backplane daemon
          trap 'installed/backplane/bin/backplane stop || true' EXIT
          if ! python3 scripts/verify_web_assets_http.py \
              http://127.0.0.1:14100/docs \
              http://127.0.0.1:14101/dashboard/overview; then
            find installed/backplane/log -maxdepth 1 -type f -print \
              -exec tail -n 100 {} \; || true
            exit 1
          fi

  publish:
    name: Publish GitHub Release
    needs:
      - qualify-memory-v2
      - build
      - installed-release-migration-smoke
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    outputs:
      version: ${{ needs.qualify-memory-v2.outputs.version }}
      gated_sha: ${{ needs.qualify-memory-v2.outputs.gated_sha }}
      release_apps: ${{ needs.qualify-memory-v2.outputs.release_apps }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.qualify-memory-v2.outputs.gated_sha }}
          fetch-depth: 0

      - name: Set selected app versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.qualify-memory-v2.outputs.version }}
          RELEASE_APPS: ${{ needs.qualify-memory-v2.outputs.release_apps }}
        run: |
          IFS=',' read -r -a release_apps <<< "$RELEASE_APPS"
          bash scripts/set-version.sh "$RELEASE_VERSION" "${release_apps[@]}"

      - name: Commit and push release version to repository
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.qualify-memory-v2.outputs.version }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(release): prepare v${RELEASE_VERSION}"
            git push origin HEAD:refs/heads/main
          fi

      - name: Prepare deploy docs and release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.qualify-memory-v2.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          mkdir -p dist

          sed "s/{{VERSION}}/$version/g" docs/deploy/backplane.md > "dist/backplane-$version-deploy.md"
          sed "s/{{VERSION}}/$version/g" docs/deploy/host_agent.md > "dist/host_agent-$version-deploy.md"
          cp docs/operations/memory.md "dist/memory-operations.md"
          cp docs/deploy/memory-release.md "dist/memory-release.md"
          cp docs/qualification/memory.md "dist/memory-qualification.md"
          cp docs/memory/host-memory-protocol.md "dist/host-memory-protocol.md"
          cp docs/operations/host-memory-edge-runbook.md "dist/host-memory-edge-runbook.md"

          cat > release-notes-header.md <<EOF
          ## Deployment

          - **Backplane server** — see the attached \`backplane-$version-deploy.md\` (Docker and OTP release instructions).
          - **Host agent** — see the attached \`host_agent-$version-deploy.md\` (per-platform tarballs and YAML config).
          - **Memory** — see the attached operations, release/rollback, and qualification runbooks.

          Docker image details are appended to these notes after the image is published.
          EOF

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '{backplane-*,host_agent-*,memory-v2-qualification}'
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.qualify-memory-v2.outputs.version }}
          target_commitish: ${{ needs.qualify-memory-v2.outputs.gated_sha }}
          name: Backplane v${{ needs.qualify-memory-v2.outputs.version }}
          body_path: release-notes-header.md
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

  hex-plugin-protocol:
    name: Publish backplane_plugin_protocol to Hex
    needs: publish
    if: needs.publish.outputs.release_apps == 'all'
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.gated_sha }}

      - name: Unify app versions
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: bash scripts/set-version.sh "$RELEASE_VERSION" all

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Validate package version
        working-directory: apps/backplane_plugin_protocol
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read backplane_plugin_protocol version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match backplane_plugin_protocol version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish backplane_plugin_protocol to Hex" >&2
            exit 1
          fi

      - name: Install package publishing dependencies
        working-directory: apps/backplane_plugin_protocol
        run: mix deps.get

      - name: Verify package documentation
        working-directory: apps/backplane_plugin_protocol
        run: mix docs

      - name: Publish package
        working-directory: apps/backplane_plugin_protocol
        run: mix hex.publish --yes

  hex-mcp-protocol:
    name: Publish backplane_mcp_protocol to Hex
    needs:
      - publish
      - hex-plugin-protocol
    if: needs.publish.outputs.release_apps == 'all'
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.gated_sha }}

      - name: Unify app versions
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: bash scripts/set-version.sh "$RELEASE_VERSION" all

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Validate package version
        working-directory: apps/backplane_mcp_protocol
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read backplane_mcp_protocol version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match backplane_mcp_protocol version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish backplane_mcp_protocol to Hex" >&2
            exit 1
          fi

      - name: Install package publishing dependencies
        working-directory: apps/backplane_mcp_protocol
        run: mix deps.get

      - name: Verify package documentation
        working-directory: apps/backplane_mcp_protocol
        run: mix docs

      - name: Publish package
        working-directory: apps/backplane_mcp_protocol
        run: mix hex.publish --yes

  hex-packages:
    name: Publish ${{ matrix.package.name }} to Hex
    needs:
      - publish
      - hex-plugin-protocol
      - hex-mcp-protocol
    if: needs.publish.outputs.release_apps == 'all'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: true
      matrix:
        package:
          - name: backplane_agent_runtime
            path: apps/backplane_agent_runtime
          - name: backplane_ai_protocol
            path: apps/backplane_ai_protocol
          - name: backplane_skill_protocol
            path: apps/backplane_skill_protocol

    permissions:
      contents: read

    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.gated_sha }}

      - name: Unify app versions
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: bash scripts/set-version.sh "$RELEASE_VERSION" all

      - name: Select package working directory
        shell: bash
        env:
          GATED_SHA: ${{ needs.publish.outputs.gated_sha }}
          PACKAGE_NAME: ${{ matrix.package.name }}
          PACKAGE_PATH: ${{ matrix.package.path }}
        run: |
          package_directory="$GITHUB_WORKSPACE/$PACKAGE_PATH"
          if [[ "$PACKAGE_NAME" == backplane_agent_runtime ]]; then
            standalone_root="$(mktemp -d "$RUNNER_TEMP/backplane-hex.XXXXXX")"
            package_directory="$standalone_root/standalone/backplane_agent_runtime"
            mkdir -p "$package_directory"
            source_revision="$(git rev-parse --verify "${GATED_SHA}^{commit}")"
            test "$source_revision" = "$GATED_SHA"
            git archive "$source_revision:$PACKAGE_PATH" | tar -x -C "$package_directory"
            # Preserve the release version set by the preceding version script.
            cp "$GITHUB_WORKSPACE/$PACKAGE_PATH/mix.exs" "$package_directory/mix.exs"
            test ! -d "$standalone_root/apps"
            echo "QUALIFIED_HEX_SOURCE_REVISION=$source_revision"
            echo "QUALIFIED_HEX_PACKAGE=$PACKAGE_NAME"
            echo "QUALIFIED_HEX_STANDALONE=true"
          fi
          echo "PACKAGE_DIRECTORY=$package_directory" >> "$GITHUB_ENV"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        if: matrix.package.name != 'backplane_agent_runtime'
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: hex-${{ matrix.package.name }}-${{ hashFiles('mix.lock', format('{0}/mix.exs', matrix.package.path)) }}
          restore-keys: |
            hex-${{ matrix.package.name }}-

      - name: Install dependencies
        if: matrix.package.name != 'backplane_agent_runtime'
        run: mix deps.get

      - name: Validate package version
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          package_version="$(awk -F '"' '/^[[:space:]]*@version/ { print $2; exit }' mix.exs)"

          if [[ -z "$package_version" ]]; then
            echo "Could not read ${{ matrix.package.name }} version from mix.exs" >&2
            exit 1
          fi

          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match ${{ matrix.package.name }} version $package_version" >&2
            exit 1
          fi

      - name: Require Hex API key
        shell: bash
        run: |
          if [[ -z "${HEX_API_KEY:-}" ]]; then
            echo "HEX_API_KEY secret is required to publish ${{ matrix.package.name }} to Hex" >&2
            exit 1
          fi

      - name: Install package publishing dependencies
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mix deps.get

      - name: Verify package documentation
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mix docs

      - name: Publish package
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: mix hex.publish --yes

  docker-image:
    name: Publish Docker Image
    needs:
      - publish
      - hex-packages
    if: >-
      ${{ !cancelled() &&
          needs.publish.result == 'success' &&
          (needs.hex-packages.result == 'success' ||
           (needs.publish.outputs.release_apps != 'all' &&
            needs.hex-packages.result == 'skipped')) }}
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      git_ref: ${{ needs.publish.outputs.gated_sha }}
      image_tag: ghcr.io/gsmlg-dev/backplane:latest
      version: ${{ needs.publish.outputs.version }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  release-docker-info:
    name: Update release page with Docker info
    needs:
      - publish
      - docker-image
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Append Docker image info to release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          IMAGE_DIGEST: ${{ needs.docker-image.outputs.digest }}
          IMAGE_TAGS: ${{ needs.docker-image.outputs.tags }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="$RELEASE_VERSION"
          release_tag="v$version"
          digest="$IMAGE_DIGEST"
          tags="$IMAGE_TAGS"

          gh release view "$release_tag" -R "$REPOSITORY" --json body -q .body > body.md

          {
            echo ""
            echo "## Docker image"
            echo ""
            echo '```sh'
            echo "docker pull ghcr.io/gsmlg-dev/backplane:$version"
            echo '```'
            echo ""
            echo "- Tags:"
            IFS=',' read -ra tag_list <<< "$tags"
            for image_tag in "${tag_list[@]}"; do
              echo "  - \`$image_tag\`"
            done
            echo "- Digest: \`$digest\`"
          } >> body.md

          gh release edit "$release_tag" -R "$REPOSITORY" --notes-file body.md
